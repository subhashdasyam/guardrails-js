name: threat-data

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/threat/**'
      - 'src/supply-chain/data/**'
      - 'scripts/refresh-threat-data.mjs'
      - 'scripts/publish-threat-data.mjs'
      - '.github/workflows/threat-data.yml'

permissions:
  contents: write

concurrency:
  group: threat-data-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Import current OSV and npm feeds into SQLite
        run: node scripts/refresh-threat-data.mjs --output threat-output
      - name: Validate source freshness, integrity, and both drivers
        run: |
          node scripts/refresh-threat-data.mjs --validate --output threat-output
          npm test
          GUARDRAILS_SQLITE_DRIVER=sqlite3 node dist/threat-data.mjs setup
          GUARDRAILS_SQLITE_DRIVER=sqlite3 node scripts/refresh-threat-data.mjs --validate --output threat-output
      - name: Check hook latency with the full database
        env:
          GUARDRAILS_THREAT_SNAPSHOT: ${{ github.workspace }}/threat-output
        run: npm run bench
      - name: Publish validated database to threat-data branch
        run: node scripts/publish-threat-data.mjs threat-output
      - name: Data summary
        run: cat threat-output/summary.md >> "$GITHUB_STEP_SUMMARY"
