name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the declared floor and is past end of life, kept so the build
        # cannot quietly start needing newer syntax. 22 and 24 are the
        # maintained lines, 26 is current.
        node: ['20', '22', '24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Rule and engine tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Committed bundle matches source
        run: npm run check:dist

      - name: Latency budget
        run: npm run bench

      - name: Audit our own source
        run: node bin/guardrails-js src --format text --fail-on high

  hooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Hook contract
        run: node test/hooks.contract.mjs
